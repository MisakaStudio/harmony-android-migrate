name: Test and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_release.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python tools/build_android.py --sdk "$ANDROID_HOME" --variant standard
      - run: python tools/build_android.py --sdk "$ANDROID_HOME" --variant usb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-apks-not-for-release
          path: dist/hmos-migrate-dev-*.apk
          if-no-files-found: error

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [31, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: python -m pip install -e .
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: python tools/build_android.py --sdk "$ANDROID_HOME" --variant usb --instrumentation --out build/hmos-smoke.apk
      - name: Enable KVM on the isolated runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          avd-name: HMOS_REPO_TEST_${{ matrix.api }}
          emulator-port: 5554
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-metrics -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            python tools/emulator_smoke.py --adb "$ANDROID_HOME/platform-tools/adb"
            --serial "$ANDROID_SERIAL" --expected-avd "HMOS_REPO_TEST_${{ matrix.api }}"
            --apk build/hmos-smoke.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-api-${{ matrix.api }}
          path: build/smoke-api-${{ matrix.api }}.json
          if-no-files-found: error
